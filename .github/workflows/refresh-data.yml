name: Refresh activity catalog

# Collects the public FCPA registration catalog server-side (no browser CORS),
# validates it, and commits the rolling snapshot when it changes.
on:
  schedule:
    - cron: "0 9 * * 1" # 09:00 UTC each Monday
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh camp fee workbook
        run: |
          curl -fSL --retry 3 -o public/fcpa-camp-spreadsheet.xlsx \
            "https://www.fairfaxcounty.gov/parks/sites/parks/files/Assets/documents/camps/fcpa-camp-spreadsheet.xlsx"
      - name: Collect latest activity catalog
        run: npm run activities
      - name: Add coordinates for newly listed venues
        run: npm run gazetteer
      - run: npm test
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/fcpa-activities.json public/fcpa-camp-spreadsheet.xlsx src/data/gazetteer.json; then
            echo "No changes to the activity catalog."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/fcpa-activities.json public/fcpa-camp-spreadsheet.xlsx src/data/gazetteer.json
            git commit -m "chore: refresh FCPA activity catalog"
            git push
          fi
